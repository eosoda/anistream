# Compose unico do AniStream.
# Os defaults executam localmente; variaveis podem ser sobrescritas por Railway
# ou outro orquestrador que suporte Compose/servicos equivalentes.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-anistream_db}
    expose:
      - '5432'
    volumes:
      - anistream_selfhosted_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-anistream_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - anistream_selfhosted_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  kenjitsu-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${KENJITSU_REDIS_PASSWORD:-kenjitsu-local-password}']
    environment:
      REDIS_PASSWORD: ${KENJITSU_REDIS_PASSWORD:-kenjitsu-local-password}
    expose:
      - '6379'
    volumes:
      - anistream_selfhosted_kenjitsu_redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  kenjitsu:
    build:
      context: ..
      dockerfile: kenjitsu/Dockerfile.selfhosted
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      API_KEY: ${KENJITSU_API_KEY:-kenjitsu-local-api-key-32-chars}
      ANIZONEURL: ${ANIZONEURL:-https://anizone.to}
      ANIKOTOURL: ${ANIKOTOURL:-https://anikototv.to}
      ANIDBURL: ${ANIDBURL:-https://anidb.app}
      ANIBDURL: ${ANIBDURL:-https://anibd.app}
      ANIMEHEAVENURL: ${ANIMEHEAVENURL:-https://animeheaven.me}
      REDIS_HOST: kenjitsu-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${KENJITSU_REDIS_PASSWORD:-kenjitsu-local-password}
      REDIS_TLS: ${KENJITSU_REDIS_TLS:-false}
      MAX_API_REQUESTS: ${KENJITSU_MAX_API_REQUESTS:-120}
      WINDOW_IN_MINUTES: ${KENJITSU_WINDOW_IN_MINUTES:-1}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --header="x-api-key: $${API_KEY}" --spider http://127.0.0.1:3000/api/extensions/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      kenjitsu-redis:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${ANISTREAM_APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@postgres:5432/anistream_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      KENJITSU_BASE_URL: ${KENJITSU_BASE_URL:-http://kenjitsu:3000}
      KENJITSU_API_KEY: ${KENJITSU_API_KEY:-kenjitsu-local-api-key-32-chars}
      KENJITSU_REQUEST_TIMEOUT_MS: ${KENJITSU_REQUEST_TIMEOUT_MS:-10000}
      KENJITSU_CACHE_TTL_SECONDS: ${KENJITSU_CACHE_TTL_SECONDS:-300}
      CALENDAR_CACHE_TTL_SECONDS: ${CALENDAR_CACHE_TTL_SECONDS:-1800}
      INITIAL_SETUP_KEY: ${INITIAL_SETUP_KEY:-setup-local-development-key-32-chars}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:-local-playback-token-secret-for-development}
      SOURCE_ENCRYPTION_KEY: ${SOURCE_ENCRYPTION_KEY:-local-source-encryption-key-for-development-32}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kenjitsu:
        condition: service_healthy

volumes:
  anistream_selfhosted_postgres_data:
  anistream_selfhosted_redis_data:
  anistream_selfhosted_kenjitsu_redis_data:
